<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trello for Outlook</title>
  <link rel="stylesheet" href="taskpane.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="config.js"></script>
  <script src="trello.js"></script>
  <script src="mail.js"></script>
  <script src="taskpane.js" defer></script>
</head>
<body>
  <!-- Loading -->
  <section id="view-loading" class="view center">
    <div class="spinner"></div>
  </section>

  <!-- Sign in -->
  <section id="view-signin" class="view center" hidden>
    <img src="assets/icon-80.png" alt="" width="56" height="56">
    <h1>Trello for Outlook</h1>
    <p class="muted">Turn emails into Trello cards, or attach them to cards you already have.</p>
    <button id="btn-signin" class="primary">Connect Trello</button>
    <form id="form-paste" class="paste" hidden>
      <label>Sign-in window showing a code? Paste it here:
        <input id="paste-token" type="text" placeholder="Paste code" autocomplete="off" spellcheck="false">
      </label>
      <button type="submit" class="primary wide">Finish connecting</button>
    </form>
    <p id="signin-error" class="error" hidden></p>
  </section>

  <!-- Main -->
  <section id="view-main" class="view" hidden>
    <nav class="tabs" role="tablist">
      <button role="tab" class="tab active" data-tab="new" aria-selected="true">New card</button>
      <button role="tab" class="tab" data-tab="existing" aria-selected="false">Add to existing</button>
    </nav>

    <!-- New card -->
    <form id="form-new" class="tab-panel" data-panel="new" autocomplete="off">
      <label>Board
        <select id="board" required></select>
      </label>
      <label>List
        <select id="list" required></select>
      </label>
      <label>Title
        <input id="title" type="text" maxlength="16384" required>
      </label>
      <label>Description
        <textarea id="desc" rows="7"></textarea>
      </label>

      <details id="more">
        <summary>Labels, members, due date</summary>
        <div class="field">
          <span class="field-label">Labels</span>
          <div id="labels" class="chips"><span class="muted small">Pick a board first</span></div>
        </div>
        <div class="field">
          <span class="field-label">Members</span>
          <div id="members" class="chips"></div>
        </div>
        <label>Due date
          <input id="due" type="datetime-local">
        </label>
        <label>Position
          <select id="pos">
            <option value="bottom" selected>Bottom of list</option>
            <option value="top">Top of list</option>
          </select>
        </label>
      </details>

      <fieldset class="options">
        <label class="check"><input type="checkbox" id="opt-body" checked> Include email body in description</label>
        <label class="check"><input type="checkbox" id="opt-link" checked> Include link back to email</label>
        <label class="check" id="row-eml"><input type="checkbox" id="opt-eml" checked> Attach email as .eml</label>
        <label class="check" id="row-files"><input type="checkbox" id="opt-files" checked> <span>Attach <span id="file-count"></span></span></label>
      </fieldset>

      <button type="submit" class="primary wide" id="btn-create">Create card</button>
    </form>

    <!-- Existing card -->
    <form id="form-existing" class="tab-panel" data-panel="existing" autocomplete="off" hidden>
      <label>Find a card
        <input id="search" type="search" placeholder="Search card names…">
      </label>
      <ul id="results" class="results"></ul>
      <div id="existing-actions" hidden>
        <p class="small">Adding to <strong id="picked-name"></strong></p>
        <fieldset class="options">
          <label class="check"><input type="checkbox" id="ex-body" checked> Post email as a comment</label>
          <label class="check" id="ex-row-eml"><input type="checkbox" id="ex-eml" checked> Attach email as .eml</label>
          <label class="check" id="ex-row-files"><input type="checkbox" id="ex-files" checked> <span>Attach <span id="ex-file-count"></span></span></label>
        </fieldset>
        <button type="submit" class="primary wide" id="btn-attach">Add to card</button>
      </div>
    </form>

    <p id="status" class="status" role="status" hidden></p>

    <footer>
      <span id="who" class="muted small"></span>
      <button id="btn-signout" class="link small">Sign out</button>
    </footer>
  </section>

  <!-- Done -->
  <section id="view-done" class="view center" hidden>
    <div class="check-mark">✓</div>
    <h1 id="done-title">Card created</h1>
    <p id="done-card" class="muted"></p>
    <a id="done-link" class="button primary" target="_blank" rel="noopener">Open in Trello</a>
    <p id="done-warn" class="warn small" hidden></p>
    <button id="btn-again" class="link">Add another</button>
  </section>
</body>
</html>
